<!--
  Письмо с привязкой почты к нынешнему аккаунту.

  Приходит по updateUser({ email }) — то есть как смена почты, хотя
  у анонимного аккаунта её и не было. Поэтому шаблон называется
  «Change Email Address», а человек видит слово «привязка»: он привязывает
  почту, а не меняет её.
-->
<h2>Почта для КМ</h2>
<p>Код для привязки почты:</p>
<p style="font-size:28px;letter-spacing:6px;margin:16px 0;"><b>{{ .Token }}</b></p>
<p>Введите его в приложении. Код живёт час.</p>
<p style="color:#666;font-size:13px;">
  Если это были не вы — просто удалите письмо. Без кода из него сделать
  ничего нельзя.
</p>
